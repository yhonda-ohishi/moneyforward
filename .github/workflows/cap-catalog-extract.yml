name: cap-catalog extract

# Nuxt 4 SPA は `app/` 配下なので working_directory を渡す。
# default branch は `master`。
# Refs ippoan/cap-catalog#29, ippoan/cap-catalog#31

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  extract:
    uses: ippoan/ci-workflows/.github/workflows/catalog-extract.yml@main
    with:
      language: ts
      working_directory: app

  # CI 完走後に PR を auto-merge する (Refs ippoan/cap-catalog#29 Phase 1 pattern)。
  # cross-org caller (yhonda-ohishi → ippoan/ci-workflows) なので `secrets: inherit`
  # が効かない。CI_APP_ID / CI_APP_PRIVATE_KEY は yhonda-ohishi org secret が前提。
  auto-merge:
    needs: [extract]
    if: github.event_name == 'pull_request'
    uses: ippoan/ci-workflows/.github/workflows/auto-merge.yml@main
    secrets:
      CI_APP_ID: ${{ secrets.CI_APP_ID }}
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
